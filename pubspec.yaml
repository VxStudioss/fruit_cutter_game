name: fruit_cutter_game
description: "A new Fruit Ninja clone project built with Flame."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # The core game engine
  flame: ^1.18.0

  # For local leaderboard storage
  shared_preferences: ^2.3.2

  # Optional: For playful arcade fonts
  google_fonts: ^6.2.1
  flame_audio: ^2.12.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Assets section with correct spacing (2 spaces for assets, 4 spaces for the path)
  assets:
    - assets/images/
    - assets/audio/